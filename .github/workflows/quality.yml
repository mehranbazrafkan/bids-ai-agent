name: quality

# Fast: the deterministic suite (contract, gate, repair, regression fixtures)
# runs on every push. Slow: the real model, the slow regression scenarios and
# the live quality harness need model weights, so they run on a self-hosted GPU
# runner on a schedule or on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  fast:
    name: deterministic suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fast tests
        run: python -m pytest -q
      - name: KB coverage audit
        run: python eval_quality.py --audit-kb
      - name: Recorded baseline (must stay pinned at 50%)
        run: python eval_quality.py --baseline

  slow:
    name: real-model regression + live quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Slow regression scenarios
        run: python -m pytest -q -m slow
      - name: Live quality harness (n=36)
        run: >
          python eval_quality.py --live
          --save-responses quality_responses.json
          --min-score 0.9
      - name: Upload recorded answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-responses
          path: quality_responses.json
          if-no-files-found: ignore
